<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HackTutor — পেন্টেস্টিং লার্নিং প্ল্যাটফর্ম</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header><h1>🛡 HackTutor</h1><span>পেন্টেস্টিং লার্নিং প্ল্যাটফর্ম — অনুমোদিত ল্যাব/CTF-এর জন্য</span></header>
<nav>
  <button class="active" data-tab="chat">💬 চ্যাট</button><button data-tab="lesson">📚 লেসন</button>
  
</nav>
<main>
<div id="chat" class="tab active"><div class="card"><div id="chatlog"><div class="msg bot">স্বাগতম! টপিক বা টার্গেট লিখো — যেমন: "ল্যাবে (DVWA) SQLi টেস্টের ধাপে ধাপে পদ্ধতি শেখাও, পেযলোডসহ"</div></div><div class="row"><input id="cmsg" placeholder="প্রশ্ন লিখো..." autocomplete="off"><button class="go" onclick="sendChat()">পাঠাও</button></div></div></div>
<div id="lesson" class="tab"><div class="card"><label>ফেজ বাছাই করো</label><select id="phase"></select><label>টার্গেট (ডোমেইন/আইপি)</label><input id="ltarget" placeholder="যেমন: 192.168.1.10 অথবা testphp.vulnweb.com"><div class="row"><button class="go" onclick="loadLesson()">কমান্ড দেখাও</button><button class="go blue" onclick="explainPhase()">ব্যাখ্যা চাও (AI)</button></div><div id="lessonout"></div></div></div>



</main>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body></html>
